name: Terraform and OpenTofu tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/terraform-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared Terraform and OpenTofu checks
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@terraform-test/v0
    with:
      engine: both
